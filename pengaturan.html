<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pengaturan — DataSiswa</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --primary:#312E81; --primary-dark:#1E1B4B; --primary-light:#EEF2FF;
    --secondary:#0D9488; --secondary-light:#CCFBF1; --accent:#F59E0B;
    --bg:#F8FAFC; --text-main:#1E293B; --text-muted:#64748B; --border:#E2E8F0; --white:#fff;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { min-height:100vh; display:flex; background:var(--bg); color:var(--text-main); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; }
  .sidebar { position:sticky; top:0; width:250px; height:100vh; flex-shrink:0; display:flex; flex-direction:column; gap:8px; padding:24px 16px; background:var(--primary-dark); color:var(--white); }
  .brand { display:flex; align-items:center; gap:10px; margin:0 0 32px; padding:0 8px; font-size:20px; font-weight:800; }
  .brand svg { width:26px; height:26px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .nav-item { display:flex; align-items:center; gap:12px; padding:11px 14px; border-radius:8px; color:rgba(255,255,255,.7); text-decoration:none; font-size:14px; font-weight:500; transition:.2s; }
  .nav-item svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .nav-item:hover { background:rgba(255,255,255,.08); color:var(--white); }
  .nav-item.active { background:var(--primary); color:var(--white); font-weight:600; }
  .main { display:flex; flex:1; flex-direction:column; min-width:0; }
  .topbar { position:sticky; top:0; z-index:2; display:flex; align-items:center; justify-content:space-between; padding:16px 32px; border-bottom:1px solid var(--border); background:var(--white); }
  .search { display:flex; align-items:center; gap:10px; width:min(320px,100%); padding:9px 14px; border:1px solid var(--border); border-radius:8px; background:var(--bg); }
  .search svg { width:16px; height:16px; flex-shrink:0; fill:none; stroke:var(--text-muted); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .search input { width:100%; border:0; outline:0; background:transparent; color:var(--text-main); font:inherit; font-size:14px; }
  .topbar-right { display:flex; align-items:center; gap:16px; }
  .icon-btn { position:relative; display:grid; width:38px; height:38px; place-items:center; border:1px solid var(--border); border-radius:8px; background:var(--white); }
  .icon-btn svg { width:18px; height:18px; fill:none; stroke:var(--text-muted); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .badge-dot { position:absolute; top:7px; right:7px; width:8px; height:8px; border:2px solid var(--white); border-radius:50%; background:var(--accent); }
  .user { display:flex; align-items:center; gap:10px; padding-left:16px; border-left:1px solid var(--border); font-size:14px; font-weight:600; }
  .avatar { display:grid; width:36px; height:36px; place-items:center; border-radius:50%; background:var(--primary-light); color:var(--primary); font-size:13px; font-weight:700; }
  .content { display:flex; flex:1; flex-direction:column; gap:24px; padding:32px; }
  .page-header { display:flex; flex-wrap:wrap; align-items:flex-start; justify-content:space-between; gap:12px; }
  .page-header h1 { margin-bottom:4px; font-size:26px; font-weight:800; letter-spacing:-.5px; }
  .page-header p { color:var(--text-muted); font-size:14px; }
  .panel { border:1px solid var(--border); border-radius:12px; background:var(--white); }
  .panel-header { padding:24px 24px 0; }
  .panel-header h2 { font-size:17px; font-weight:700; }
  .panel-header p { margin-top:7px; color:var(--text-muted); font-size:13px; }
  .settings-form { max-width:760px; padding:22px 24px 24px; }
  .form-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; }
  .field { display:flex; flex-direction:column; gap:8px; }
  .field label { font-size:13px; font-weight:600; }
  .field input, .field select { min-height:42px; padding:10px 12px; border:1px solid var(--border); border-radius:8px; background:var(--white); color:var(--text-main); font:inherit; font-size:14px; }
  .field input:focus, .field select:focus { border-color:var(--primary); outline:3px solid var(--primary-light); }
  .check-row { display:flex; align-items:center; gap:10px; margin-top:20px; font-size:14px; }
  .check-row input { width:16px; height:16px; accent-color:var(--primary); }
  .form-actions { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-top:24px; }
  .btn { display:inline-flex; align-items:center; justify-content:center; padding:10px 16px; border:0; border-radius:8px; font:inherit; font-size:13px; font-weight:600; cursor:pointer; }
  .btn-primary { background:var(--primary); color:var(--white); }
  .btn-primary:hover { background:var(--primary-dark); }
  .btn-secondary { background:var(--bg); color:var(--text-main); }
  .save-message { min-height:20px; color:var(--secondary); font-size:13px; }
  .help-text { margin-top:12px; color:var(--text-muted); font-size:12px; }
  @media(max-width:760px) {
    .sidebar { width:76px; padding:20px 10px; }
    .brand { justify-content:center; padding:0; font-size:0; }
    .brand svg { flex:0 0 26px; }
    .nav-item { justify-content:center; padding:12px 8px; font-size:0; }
    .nav-item svg { width:20px; height:20px; }
    .topbar { padding:12px 16px; }
    .content { padding:22px 16px; }
    .user span, .icon-btn { display:none; }
    .form-grid { grid-template-columns:1fr; }
  }
</style>
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg><span id="brand-name">DataSiswa</span></div>
    <a class="nav-item" href="dashbard.html" aria-label="Dashboard"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>Dashboard</a>
    <a class="nav-item" href="data-siswa.html" aria-label="Data Siswa"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>Data Siswa</a>
    <a class="nav-item" href="absensi.html" aria-label="Absensi"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>Absensi</a>
    <a class="nav-item active" href="pengaturan.html" aria-current="page" aria-label="Pengaturan"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path></svg>Pengaturan</a>
  </aside>
  <div class="main">
    <header class="topbar">
      <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg><input type="search" placeholder="Cari siswa..." aria-label="Cari siswa" readonly></label>
      <div class="topbar-right">
        <button class="icon-btn" type="button" title="Notifikasi" aria-label="Notifikasi"><svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg><span class="badge-dot" id="notification-dot"></span></button>
        <div class="user"><div class="avatar" id="admin-avatar">AD</div><span id="admin-label">Admin</span></div>
      </div>
    </header>
    <main class="content">
      <div class="page-header"><div><h1>Pengaturan</h1><p>Atur preferensi aplikasi DataSiswa.</p></div></div>
      <section class="panel">
        <header class="panel-header"><h2>Preferensi Aplikasi</h2><p>Perubahan disimpan di browser ini dan dapat diperbarui kapan saja.</p></header>
        <form class="settings-form" id="settings-form">
          <div class="form-grid">
            <div class="field"><label for="school-name">Nama sekolah / aplikasi</label><input id="school-name" name="schoolName" type="text" required></div>
            <div class="field"><label for="admin-name">Nama admin</label><input id="admin-name" name="adminName" type="text" required></div>
          </div>
          <label class="check-row"><input type="checkbox" name="notifications"> Aktifkan notifikasi kehadiran</label>
          <div class="form-actions"><button class="btn btn-primary" type="submit">Simpan Pengaturan</button><button class="btn btn-secondary" type="reset">Reset Form</button></div>
          <p class="save-message" id="save-message" role="status" aria-live="polite"></p>
          <p class="help-text">Data pengaturan tersimpan secara lokal pada browser/perangkat ini.</p>
        </form>
      </section>
    </main>
  </div>
  <script>
    const form = document.getElementById("settings-form");
    const saveMessage = document.getElementById("save-message");
    const storageKey = "datasiswa-settings";
    const defaults = {
      schoolName: "DataSiswa",
      adminName: "Admin",
      notifications: true
    };
    const savedSettings = localStorage.getItem(storageKey);
    const settings = { ...defaults };
    if (savedSettings) {
      const parsedSettings = JSON.parse(savedSettings);
      if (parsedSettings && typeof parsedSettings === "object") {
        if (typeof parsedSettings.schoolName === "string") settings.schoolName = parsedSettings.schoolName;
        if (typeof parsedSettings.adminName === "string") settings.adminName = parsedSettings.adminName;
        if (typeof parsedSettings.notifications === "boolean") settings.notifications = parsedSettings.notifications;
      }
    }

    form.elements.schoolName.value = settings.schoolName;
    form.elements.schoolName.defaultValue = settings.schoolName;
    form.elements.adminName.value = settings.adminName;
    form.elements.adminName.defaultValue = settings.adminName;
    form.elements.notifications.checked = Boolean(settings.notifications);
    form.elements.notifications.defaultChecked = Boolean(settings.notifications);
    document.getElementById("brand-name").textContent = settings.schoolName;
    document.getElementById("admin-label").textContent = settings.adminName;
    document.getElementById("admin-avatar").textContent =
      settings.adminName.split(/\s+/).slice(0, 2).map((part) => part[0]).join("").toUpperCase();
    document.getElementById("notification-dot").hidden = !settings.notifications;

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const formData = new FormData(form);
      const updatedSettings = {
        schoolName: String(formData.get("schoolName")).trim(),
        adminName: String(formData.get("adminName")).trim(),
        notifications: formData.has("notifications")
      };
      localStorage.setItem(storageKey, JSON.stringify(updatedSettings));
      form.elements.schoolName.defaultValue = updatedSettings.schoolName;
      form.elements.adminName.defaultValue = updatedSettings.adminName;
      form.elements.notifications.defaultChecked = updatedSettings.notifications;
      document.getElementById("brand-name").textContent = updatedSettings.schoolName;
      document.getElementById("admin-label").textContent = updatedSettings.adminName;
      document.getElementById("admin-avatar").textContent =
        updatedSettings.adminName.split(/\s+/).slice(0, 2).map((part) => part[0]).join("").toUpperCase();
      document.getElementById("notification-dot").hidden = !updatedSettings.notifications;
      saveMessage.textContent = "Pengaturan berhasil disimpan.";
    });
    form.addEventListener("reset", () => {
      window.setTimeout(() => { saveMessage.textContent = ""; }, 0);
    });
  </script>
</body>
</html>
