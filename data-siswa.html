<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Siswa — DataSiswa</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #312E81;
    --primary-dark: #1E1B4B;
    --primary-light: #EEF2FF;
    --secondary: #0D9488;
    --secondary-light: #CCFBF1;
    --accent: #F59E0B;
    --accent-light: #FEF3C7;
    --bg: #F8FAFC;
    --text-main: #1E293B;
    --text-muted: #64748B;
    --border: #E2E8F0;
    --white: #FFFFFF;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; display: flex; background: var(--bg); color: var(--text-main);
    font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased;
  }
  .sidebar {
    position: sticky; top: 0; width: 250px; height: 100vh; flex-shrink: 0;
    display: flex; flex-direction: column; gap: 8px; padding: 24px 16px;
    background: var(--primary-dark); color: var(--white);
  }
  .brand { display: flex; align-items: center; gap: 10px; margin: 0 0 32px; padding: 0 8px; font-size: 20px; font-weight: 800; }
  .brand svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .nav-item {
    display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 8px;
    color: rgba(255,255,255,.7); text-decoration: none; font-size: 14px; font-weight: 500; transition: .2s;
  }
  .nav-item svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .nav-item:hover { background: rgba(255,255,255,.08); color: var(--white); }
  .nav-item.active { background: var(--primary); color: var(--white); font-weight: 600; }
  .main { display: flex; flex: 1; flex-direction: column; min-width: 0; }
  .topbar {
    position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between;
    padding: 16px 32px; background: var(--white); border-bottom: 1px solid var(--border);
  }
  .search { display: flex; align-items: center; gap: 10px; width: min(320px, 100%); padding: 9px 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); }
  .search svg { width: 16px; height: 16px; fill: none; stroke: var(--text-muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .search input { width: 100%; border: 0; outline: 0; background: transparent; color: var(--text-main); font: inherit; font-size: 14px; }
  .topbar-right { display: flex; align-items: center; gap: 16px; }
  .icon-btn { position: relative; display: grid; width: 38px; height: 38px; place-items: center; border: 1px solid var(--border); border-radius: 8px; background: var(--white); }
  .icon-btn svg { width: 18px; height: 18px; fill: none; stroke: var(--text-muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .badge-dot { position: absolute; top: 7px; right: 7px; width: 8px; height: 8px; border: 2px solid var(--white); border-radius: 50%; background: var(--accent); }
  .user { display: flex; align-items: center; gap: 10px; padding-left: 16px; border-left: 1px solid var(--border); font-size: 14px; font-weight: 600; }
  .avatar { display: grid; width: 36px; height: 36px; place-items: center; border-radius: 50%; background: var(--primary-light); color: var(--primary); font-size: 13px; font-weight: 700; }
  .content { display: flex; flex: 1; flex-direction: column; gap: 24px; padding: 32px; }
  .page-header { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .page-header h1 { margin-bottom: 4px; font-size: 26px; font-weight: 800; letter-spacing: -.5px; }
  .page-header p { color: var(--text-muted); font-size: 14px; }
  .date-chip { padding: 9px 16px; border: 1px solid var(--border); border-radius: 8px; background: var(--white); color: var(--text-muted); font-size: 13px; font-weight: 500; }
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 20px; }
  .stat-card { display: flex; flex-direction: column; gap: 14px; padding: 20px; border: 1px solid var(--border); border-radius: 12px; background: var(--white); }
  .stat-label { color: var(--text-muted); font-size: 13px; font-weight: 500; }
  .stat-value { font-size: 26px; font-weight: 800; letter-spacing: -1px; }
  .panel { overflow: hidden; border: 1px solid var(--border); border-radius: 12px; background: var(--white); }
  .table-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 22px 24px; }
  .table-head h2 { font-size: 16px; font-weight: 700; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 15px;
    border: 0; border-radius: 8px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none;
  }
  .btn-primary { background: var(--primary); color: var(--white); }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-secondary { background: var(--primary-light); color: var(--primary); }
  .btn-danger { background: #FEF2F2; color: #B91C1C; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  thead { background: var(--bg); }
  th { padding: 12px 20px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); color: var(--text-muted); font-size: 11px; font-weight: 700; letter-spacing: .5px; text-align: left; text-transform: uppercase; white-space: nowrap; }
  td { padding: 14px 20px; border-bottom: 1px solid var(--border); font-size: 14px; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: #FAFBFF; }
  .name-cell { display: flex; align-items: center; gap: 12px; white-space: nowrap; }
  .avatar-sm { display: grid; width: 34px; height: 34px; flex-shrink: 0; place-items: center; border-radius: 50%; background: var(--primary-light); color: var(--primary); font-size: 11px; font-weight: 700; }
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 20px; background: var(--secondary-light); color: var(--secondary); font-size: 12px; font-weight: 600; white-space: nowrap; }
  .badge::before { width: 6px; height: 6px; border-radius: 50%; background: currentColor; content: ''; }
  .empty-state { padding: 28px; color: var(--text-muted); text-align: center; }
  .form-panel { padding: 0 24px; }
  .form-panel summary { padding: 18px 0; color: var(--primary); font-size: 14px; font-weight: 700; cursor: pointer; }
  .student-form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; padding-bottom: 22px; }
  .field { display: flex; flex-direction: column; gap: 7px; }
  .field label { font-size: 13px; font-weight: 600; }
  .field input, .field select { width: 100%; min-height: 42px; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--white); color: var(--text-main); font: inherit; font-size: 14px; }
  .form-actions { display: flex; grid-column: 1 / -1; gap: 10px; align-items: center; }
  .form-status { color: var(--secondary); font-size: 13px; }
  @media (max-width: 760px) {
    .sidebar { width: 76px; padding: 20px 10px; }
    .brand { justify-content: center; padding: 0; font-size: 0; }
    .brand svg { flex: 0 0 26px; }
    .nav-item { justify-content: center; padding: 12px 8px; font-size: 0; }
    .nav-item svg { width: 20px; height: 20px; }
    .topbar { padding: 12px 16px; }
    .content { padding: 22px 16px; }
    .user span, .icon-btn { display: none; }
    .student-form { grid-template-columns: 1fr; }
    .form-actions { grid-column: auto; flex-wrap: wrap; }
  }
</style>
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
      <span id="brand-name">DataSiswa</span>
    </div>
    <a class="nav-item" href="dashbard.html" aria-label="Dashboard">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>Dashboard
    </a>
    <a class="nav-item active" href="data-siswa.html" aria-current="page" aria-label="Data Siswa">
      <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>Data Siswa
    </a>
    <a class="nav-item" href="absensi.html" aria-label="Absensi">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>Absensi
    </a>
    <a class="nav-item" href="pengaturan.html" aria-label="Pengaturan">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-.1-1z"></path></svg>Pengaturan
    </a>
  </aside>

  <div class="main">
    <header class="topbar">
      <label class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input id="student-search" type="search" placeholder="Cari siswa..." aria-label="Cari siswa">
      </label>
      <div class="topbar-right">
        <button class="icon-btn" type="button" title="Notifikasi" aria-label="Notifikasi">
          <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg><span class="badge-dot" id="notification-dot"></span>
        </button>
        <div class="user"><div class="avatar" id="admin-avatar">AD</div><span id="admin-label">Admin</span></div>
      </div>
    </header>

    <main class="content">
      <div class="page-header">
        <div><h1>Data Siswa</h1><p>Kelola informasi dan data siswa.</p></div>
        <div class="date-chip" id="current-date"></div>
      </div>

      <section class="stats-grid" aria-label="Ringkasan data siswa">
        <article class="stat-card"><span class="stat-label">Total Siswa</span><strong class="stat-value" id="student-count">0</strong></article>
        <article class="stat-card"><span class="stat-label">Kelas Aktif</span><strong class="stat-value">12</strong></article>
        <article class="stat-card"><span class="stat-label">Siswa Laki-laki</span><strong class="stat-value" id="male-count">0</strong></article>
        <article class="stat-card"><span class="stat-label">Siswa Perempuan</span><strong class="stat-value" id="female-count">0</strong></article>
      </section>

      <details class="panel form-panel">
        <summary>+ Tambah Data Siswa</summary>
        <form class="student-form" id="student-form">
          <div class="field"><label for="student-name">Nama Lengkap</label><input id="student-name" name="name" required></div>
          <div class="field"><label for="student-nis">NIS</label><input id="student-nis" name="nis" required inputmode="numeric"></div>
          <div class="field"><label for="student-class">Kelas</label><select id="student-class" name="className" required><option value="">Pilih kelas</option><option>X RPL</option><option>XI RPL</option><option>XII RPL</option><option>X TKJ</option><option>XI TKJ</option><option>XII TKJ</option></select></div>
          <div class="field"><label for="student-gender">Jenis Kelamin</label><select id="student-gender" name="gender" required><option value="">Pilih jenis kelamin</option><option value="Laki-laki">Laki-laki</option><option value="Perempuan">Perempuan</option></select></div>
          <div class="form-actions"><button class="btn btn-primary" type="submit">Simpan Siswa</button><button class="btn btn-secondary" type="reset">Reset</button><span class="form-status" id="form-status" role="status"></span></div>
        </form>
      </details>

      <section class="panel">
        <div class="table-head"><h2>Daftar Siswa</h2><span class="stat-label" id="table-count"></span></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>NIS</th><th>Nama</th><th>Kelas</th><th>Jenis Kelamin</th><th>Status</th></tr></thead>
            <tbody id="student-rows"></tbody>
          </table>
          <p class="empty-state" id="empty-state" hidden>Tidak ada siswa yang cocok dengan pencarian.</p>
        </div>
      </section>
    </main>
  </div>

  <script>
    const defaultStudents = [
      { nis: "24001", name: "Andi Saputra", className: "XII RPL", gender: "Laki-laki" },
      { nis: "24002", name: "Budi Santoso", className: "XII TKJ", gender: "Laki-laki" },
      { nis: "24003", name: "Citra Dewi", className: "XI RPL", gender: "Perempuan" }
    ];
    const storageKey = "datasiswa-students";
    const students = JSON.parse(localStorage.getItem(storageKey) || "null") || defaultStudents;
    const tableBody = document.getElementById("student-rows");
    const searchInput = document.getElementById("student-search");
    const formStatus = document.getElementById("form-status");
    const savedSettings = JSON.parse(localStorage.getItem("datasiswa-settings") || "null");
    if (savedSettings && typeof savedSettings === "object") {
      if (typeof savedSettings.schoolName === "string") {
        document.getElementById("brand-name").textContent = savedSettings.schoolName;
      }
      if (typeof savedSettings.adminName === "string") {
        document.getElementById("admin-label").textContent = savedSettings.adminName;
        document.getElementById("admin-avatar").textContent =
          savedSettings.adminName.split(/\s+/).slice(0, 2).map((part) => part[0]).join("").toUpperCase();
      }
      if (typeof savedSettings.notifications === "boolean") {
        document.getElementById("notification-dot").hidden = !savedSettings.notifications;
      }
    }

    document.getElementById("current-date").textContent =
      new Intl.DateTimeFormat("id-ID", { dateStyle: "long" }).format(new Date());

    function renderStudents() {
      const query = searchInput.value.trim().toLocaleLowerCase("id-ID");
      const filtered = students.filter((student) =>
        [student.nis, student.name, student.className, student.gender]
          .some((value) => value.toLocaleLowerCase("id-ID").includes(query))
      );
      tableBody.replaceChildren();
      filtered.forEach((student) => {
        const row = document.createElement("tr");
        const nis = document.createElement("td");
        const nisStrong = document.createElement("strong");
        nisStrong.textContent = student.nis;
        nis.append(nisStrong);

        const name = document.createElement("td");
        const nameCell = document.createElement("div");
        const avatar = document.createElement("div");
        avatar.className = "avatar-sm";
        avatar.textContent = student.name.split(/\s+/).slice(0, 2).map((part) => part[0]).join("").toUpperCase();
        nameCell.className = "name-cell";
        nameCell.append(avatar, document.createTextNode(student.name));
        name.append(nameCell);

        const classCell = document.createElement("td");
        classCell.textContent = student.className;
        const gender = document.createElement("td");
        gender.textContent = student.gender;
        const status = document.createElement("td");
        const badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = "Aktif";
        status.append(badge);
        row.append(nis, name, classCell, gender, status);
        tableBody.append(row);
      });
      document.getElementById("student-count").textContent = students.length;
      document.getElementById("male-count").textContent = students.filter((student) => student.gender === "Laki-laki").length;
      document.getElementById("female-count").textContent = students.filter((student) => student.gender === "Perempuan").length;
      document.getElementById("table-count").textContent = `${filtered.length} dari ${students.length} siswa`;
      document.getElementById("empty-state").hidden = filtered.length !== 0;
    }

    searchInput.addEventListener("input", renderStudents);
    document.getElementById("student-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const formData = new FormData(event.currentTarget);
      const student = {
        nis: String(formData.get("nis")).trim(),
        name: String(formData.get("name")).trim(),
        className: String(formData.get("className")),
        gender: String(formData.get("gender"))
      };
      if (students.some((item) => item.nis === student.nis)) {
        formStatus.textContent = "NIS tersebut sudah terdaftar.";
        return;
      }
      students.push(student);
      localStorage.setItem(storageKey, JSON.stringify(students));
      event.currentTarget.reset();
      formStatus.textContent = "Data siswa berhasil disimpan.";
      renderStudents();
    });

    renderStudents();
  </script>
</body>
</html>
